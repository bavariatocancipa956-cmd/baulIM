name: accciones_ol
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.0
  image_picker: ^1.1.2
  pdf: ^3.13.0
  printing: ^5.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icono_ol.png

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icono_ol.png"
  web:
    generate: true
    image_path: "assets/icono_ol.png"
    background_color: "#FFFFFF"
    theme_color: "#0D47A1"